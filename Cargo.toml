[package]
name = "nacelle-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The Vulkan renderer of the nacelle project: two pipelines over one vertex stream (glyph atlas + registered RGBA images), swapchain bit depth up to sixteen, and a 3D grading LUT"
license = "MIT"
repository = "https://github.com/JOCKER3201/nacelle-renderer"

[lib]
name = "nacelle_renderer"

# The toolkit: the draw list this renderer eats (vertices, runs,
# image handles) and the glyph-atlas dimensions.
[dependencies]
libnacelle = { git = "https://github.com/JOCKER3201/libnacelle" }

# Vulkan, and surfaces from raw window handles.
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"

# WGSL -> SPIR-V at startup (pure Rust, no external tools).
naga = { version = "0.19", features = ["wgsl-in", "spv-out"] }

# The SPIR-V header — opcode and GLSL.std.450 names and nothing else
# (no_std, one dependency, no parser). Already in this tree as naga's
# own dependency at the same version, so it adds no download; taking it
# directly is what keeps `spirvstat` from transcribing the opcode table
# by hand into the file whose whole job is to report exact numbers.
# License: Apache-2.0 (gfx-rs/rspirv) — on the project's allowed list.
spirv = "0.3"

# TEMPORARY, for the duration of the feat/vector-glow branch only.
# SHAPE_ADD and the soft flag bits live in libnacelle and this crate
# reads them; the pin above cannot name a commit that has not been
# pushed, so the sibling worktree stands in until the merge order runs
# (libnacelle, then the pin, then this crate). MUST be removed and the
# lock re-pinned before this branch is merged.
[patch."https://github.com/JOCKER3201/libnacelle"]
libnacelle = { path = "../libnacelle" }
